<svg width="630" height="500" viewBox="0 0 630 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark room background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <!-- Warm desk lamp glow -->
    <radialGradient id="lampCone" cx="68%" cy="12%" r="85%">
      <stop offset="0%" stop-color="#ffd57a" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#e8b34b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#b8832a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07080b" stop-opacity="0"/>
    </radialGradient>

    <!-- Desk wood tone -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1109"/>
      <stop offset="50%" stop-color="#24180d"/>
      <stop offset="100%" stop-color="#1a1109"/>
    </linearGradient>

    <!-- Manila paper tone -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#fdf8ec"/>
      <stop offset="100%" stop-color="#ece0c3"/>
    </linearGradient>

    <!-- Carbon paper tone -->
    <linearGradient id="carbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1e24"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>

    <!-- Vignette filter -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Stamp texture simulation filter -->
    <filter id="stampRough">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Soft shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base background (wall & room) -->
  <rect width="630" height="500" fill="url(#bgGrad)"/>

  <!-- Background window blinds & shadows -->
  <g opacity="0.15" stroke="#4a5268" stroke-width="6">
    <line x1="0" y1="60" x2="420" y2="20"/>
    <line x1="0" y1="95" x2="420" y2="55"/>
    <line x1="0" y1="130" x2="420" y2="90"/>
    <line x1="0" y1="165" x2="420" y2="125"/>
    <line x1="0" y1="200" x2="420" y2="160"/>
  </g>

  <!-- Desk surface -->
  <rect x="0" y="220" width="630" height="280" fill="url(#deskGrad)"/>
  <line x1="0" y1="220" x2="630" y2="220" stroke="#3a2514" stroke-width="3"/>
  <line x1="0" y1="223" x2="630" y2="223" stroke="#0d0804" stroke-width="1.5"/>

  <!-- Light cone from overhead brass lamp -->
  <polygon points="430,-20 180,500 630,500 560,-20" fill="url(#lampCone)" opacity="0.85"/>
  <ellipse cx="440" cy="380" rx="160" ry="85" fill="#ffd57a" opacity="0.14"/>

  <!-- Hanging desk lamp housing -->
  <g transform="translate(470, -10)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#0e1014" stroke-width="8"/>
    <polygon points="-46,70 46,70 34,115 -34,115" fill="#181b22" stroke="#5a451e" stroke-width="2.5"/>
    <ellipse cx="0" cy="115" rx="34" ry="10" fill="#e8b34b" opacity="0.95"/>
    <circle cx="0" cy="118" r="16" fill="#fff5d0" opacity="0.85"/>
  </g>

  <!-- Dust motes floating in light cone -->
  <g fill="#ffd57a" opacity="0.6">
    <circle cx="410" cy="180" r="1.8"/>
    <circle cx="460" cy="220" r="1.3"/>
    <circle cx="370" cy="260" r="2.2"/>
    <circle cx="490" cy="290" r="1.5"/>
    <circle cx="430" cy="340" r="1.9"/>
    <circle cx="320" cy="310" r="1.4"/>
  </g>

  <!-- Manila Docket File Folder on desk -->
  <g transform="translate(80, 240) rotate(-4)" filter="url(#dropShadow)">
    <!-- Folder tab -->
    <path d="M 0,20 L 70,20 L 85,0 L 220,0 L 235,20 L 320,20 L 320,230 L 0,230 Z" fill="#c99f58"/>
    <text x="100" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#3a250a" letter-spacing="1.5">ARIA LOGS · DOCKET #12</text>
    <!-- Folder main leaf -->
    <rect x="0" y="20" width="320" height="210" rx="4" fill="#deb874"/>
    <!-- Ruled lines -->
    <g stroke="#ba934f" stroke-width="1" opacity="0.5">
      <line x1="20" y1="50" x2="300" y2="50"/>
      <line x1="20" y1="75" x2="300" y2="75"/>
      <line x1="20" y1="100" x2="300" y2="100"/>
      <line x1="20" y1="125" x2="300" y2="125"/>
      <line x1="20" y1="150" x2="300" y2="150"/>
      <line x1="20" y1="175" x2="300" y2="175"/>
    </g>
  </g>

  <!-- Evidence Slip 1 (HUMAN precedent) -->
  <g transform="translate(110, 265) rotate(2)" filter="url(#dropShadow)">
    <rect width="210" height="150" rx="2" fill="url(#paperGrad)"/>
    <text x="14" y="26" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#554428" letter-spacing="1">EXHIBIT #04 · DAWN</text>
    <line x1="14" y1="34" x2="196" y2="34" stroke="#d5c6a5" stroke-width="1"/>
    
    <text x="14" y="54" font-family="ui-monospace, monospace" font-size="9" fill="#7a684b">WHERE: 🌊 water</text>
    <text x="14" y="70" font-family="ui-monospace, monospace" font-size="9" fill="#7a684b">WHEN:  🌅 dawn</text>
    <text x="14" y="86" font-family="ui-monospace, monospace" font-size="9" fill="#7a684b">WHO:   🧍 alone</text>
    <text x="14" y="102" font-family="ui-monospace, monospace" font-size="9" fill="#7a684b">SET:   🌤️ outdoor</text>

    <!-- Pier at 5:40am text -->
    <text x="14" y="124" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#2d2214">“Pier at 5:40am. First light.”</text>

    <!-- HUMAN Rubber Stamp -->
    <g transform="translate(100, 70) rotate(-12)" filter="url(#stampRough)">
      <rect x="0" y="0" width="94" height="40" rx="3" fill="none" stroke="#256e34" stroke-width="3" opacity="0.88"/>
      <text x="47" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" font-weight="900" letter-spacing="3" fill="#256e34" opacity="0.88">HUMAN</text>
      <!-- ink splatter specks -->
      <circle cx="-4" cy="18" r="1.2" fill="#256e34" opacity="0.7"/>
      <circle cx="98" cy="8" r="1.4" fill="#256e34" opacity="0.6"/>
      <circle cx="82" cy="44" r="1" fill="#256e34" opacity="0.7"/>
    </g>
  </g>

  <!-- The Anomaly Packet: VALE (+0.003s) -->
  <g transform="translate(320, 275) rotate(-6)" filter="url(#dropShadow)">
    <rect width="240" height="175" rx="3" fill="url(#paperGrad)" stroke="#c24438" stroke-width="2"/>
    <!-- Red warning header band -->
    <rect width="240" height="26" rx="2" fill="#99261c"/>
    <text x="12" y="17" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" fill="#fff" letter-spacing="1.5">⚡ ANOMALY REPORT · VALE</text>

    <text x="14" y="48" font-family="ui-monospace, monospace" font-size="9.5" fill="#44321e">FILER:     <b>VALE</b></text>
    <text x="14" y="65" font-family="ui-monospace, monospace" font-size="9.5" font-weight="bold" fill="#b8281d">FILED:     +0.003s (3ms DELAY)</text>
    <text x="14" y="82" font-family="ui-monospace, monospace" font-size="9.5" fill="#44321e">CRITERIA:  ALL 4 PASSED (100%)</text>
    
    <line x1="14" y1="94" x2="226" y2="94" stroke="#d5c6a5" stroke-width="1"/>
    <text x="14" y="114" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1c160f">“I was awake for first light.”</text>
    <text x="14" y="132" font-family="ui-monospace, monospace" font-size="8.5" fill="#776246">STATUS: AUTOMATED INFILTRATOR</text>

    <!-- Big Bold SUS Stamp -->
    <g transform="translate(125, 95) rotate(-16)" filter="url(#stampRough)">
      <rect x="0" y="0" width="88" height="44" rx="4" fill="none" stroke="#ba261b" stroke-width="3.5" opacity="0.94"/>
      <text x="44" y="32" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="900" letter-spacing="4" fill="#ba261b" opacity="0.94">SUS</text>
      <!-- ink splatter specks -->
      <circle cx="-6" cy="12" r="1.6" fill="#ba261b" opacity="0.8"/>
      <circle cx="94" cy="36" r="1.5" fill="#ba261b" opacity="0.75"/>
      <circle cx="20" cy="48" r="1.2" fill="#ba261b" opacity="0.7"/>
    </g>
  </g>

  <!-- The Punched Time Card -->
  <g transform="translate(480, 210) rotate(14)" filter="url(#dropShadow)">
    <rect width="86" height="150" rx="3" fill="#faf2df" stroke="#bda67f" stroke-width="1.2"/>
    <rect x="0" y="0" width="86" height="24" rx="2" fill="#b98f4e"/>
    <text x="43" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#3a250a" letter-spacing="1">WEEK 12</text>
    
    <!-- Punch slots -->
    <g fill="#1a1109" opacity="0.85">
      <!-- Slot 1 (punched!) -->
      <rect x="16" y="36" width="54" height="12" rx="6" fill="#0f1118"/>
      <!-- Slots 2-5 unpunched outlines -->
      <rect x="16" y="58" width="54" height="12" rx="6" fill="none" stroke="#c0ac8c" stroke-width="1.5"/>
      <rect x="16" y="80" width="54" height="12" rx="6" fill="none" stroke="#c0ac8c" stroke-width="1.5"/>
      <rect x="16" y="102" width="54" height="12" rx="6" fill="none" stroke="#c0ac8c" stroke-width="1.5"/>
      <rect x="16" y="124" width="54" height="12" rx="6" fill="none" stroke="#c0ac8c" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Wooden Hand Stamp Resting on Desk -->
  <g transform="translate(50, 410) rotate(18)" filter="url(#dropShadow)">
    <!-- Wooden handle -->
    <path d="M 30,0 C 40,-40 20,-70 30,-90 C 35,-100 45,-100 50,-90 C 60,-70 40,-40 50,0 Z" fill="#693b16" stroke="#3b1f09" stroke-width="2"/>
    <!-- Brass ferrule -->
    <rect x="24" y="0" width="32" height="10" rx="2" fill="#c49a3c" stroke="#6b5118" stroke-width="1.5"/>
    <!-- Heavy base plate -->
    <rect x="0" y="10" width="80" height="20" rx="4" fill="#38210f" stroke="#1d0f05" stroke-width="2"/>
    <!-- Rubber die with red ink edge -->
    <rect x="4" y="30" width="72" height="6" rx="1" fill="#ba261b"/>
  </g>

  <!-- Big Title & Branding Header Lockup -->
  <g transform="translate(50, 70)">
    <!-- Kicker tag -->
    <g>
      <rect x="0" y="0" width="180" height="22" rx="3" fill="#e8b34b" opacity="0.15"/>
      <text x="12" y="15" font-family="ui-monospace, monospace" font-size="10.5" font-weight="bold" fill="#e8b34b" letter-spacing="2">GITHUB GAME OFF 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" font-family="'Arial Black', Impact, ui-sans-serif, system-ui" font-size="58" font-weight="900" letter-spacing="4" fill="#f5ede0" filter="url(#dropShadow)">NIGHT SHIFT</text>
    
    <!-- Tagline -->
    <text x="2" y="102" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#cfc2a4" letter-spacing="2">DEDUCE BY DAY. JUDGE BY NIGHT. CATCH THE MACHINE.</text>

    <!-- Genre Badge -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="168" height="20" rx="10" fill="#1b1f2b" stroke="#3b4255" stroke-width="1.2"/>
      <text x="84" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#899bb5" letter-spacing="1">DEDUCTION THRILLER</text>
    </g>
  </g>

  <!-- Corner GitHub Octocat / Theme Stamp -->
  <g transform="translate(535, 30)">
    <circle cx="28" cy="28" r="24" fill="#12151c" stroke="#e8b34b" stroke-width="1.5" opacity="0.85"/>
    <text x="28" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#e8b34b" letter-spacing="1">THEME</text>
    <text x="28" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#f5ede0" letter-spacing="1.5">SHIFT</text>
  </g>

  <!-- Overall Vignette overlay -->
  <rect width="630" height="500" fill="url(#vignette)" pointer-events="none"/>
</svg>
